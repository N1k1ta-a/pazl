<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Собери нас в Тейвате 💙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #2a1a3e, #0f3460);
    color: #fff;
    overflow-x: hidden;
  }
  .stars {
    position: fixed; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #c9a0ff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 80% 20%, #c9a0ff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(2px 2px at 90% 60%, #c9a0ff, transparent);
    animation: twinkle 4s infinite alternate;
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle { from {opacity:0.4} to {opacity:0.9} }

  .wrapper {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }

  h1 {
    font-size: 22px;
    margin-bottom: 10px;
    line-height: 1.4;
    background: linear-gradient(135deg, #c9a0ff, #8fb8ff, #ffb3d9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 15px;
    opacity: 0.85;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* ===== ПАЗЛ ===== */
  .puzzle-wrap {
    position: relative;
    width: 100%;
    max-width: 380px;
    aspect-ratio: 3 / 4; /* Под вертикальный скриншот */
    margin: 0 auto 20px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(201, 160, 255, 0.5);
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(201, 160, 255, 0.3);
  }
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    height: 100%;
    gap: 2px;
    padding: 2px;
  }
  .cell {
    background: rgba(201, 160, 255, 0.12);
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    position: relative;
    overflow: hidden;
  }
  .cell::before {
    content: '✦';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(201, 160, 255, 0.4);
    font-size: 20px;
  }
  .cell.filled::before { display: none; }
  .cell.filled {
    background-size: 300% 300%;
    background-repeat: no-repeat;
    cursor: default;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.8); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .cell:not(.filled):hover {
    background: rgba(201, 160, 255, 0.3);
    transform: scale(1.05);
  }

  /* ===== КОМПЛИМЕНТ ===== */
  .compliment {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, #c9a0ff, #8fb8ff, #ffb3d9);
    color: #1a1a2e;
    padding: 18px 26px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 15px 50px rgba(201, 160, 255, 0.7);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    max-width: 85vw;
    text-align: center;
    line-height: 1.4;
  }
  .compliment.show {
    animation: popCompliment 2.2s ease forwards;
  }
  @keyframes popCompliment {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    25%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    80%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
  }

  /* ===== СТАТИСТИКА ===== */
  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 15px;
    font-size: 14px;
    opacity: 0.9;
  }
  .stats span { font-weight: 700; color: #c9a0ff; }

  .btn {
    background: linear-gradient(135deg, #c9a0ff, #8fb8ff);
    color: #1a1a2e;
    border: none;
    padding: 15px 35px;
    font-size: 16px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(201, 160, 255, 0.5);
    transition: transform 0.3s, box-shadow 0.3s;
    margin: 5px;
    user-select: none;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: scale(0.95); }

  /* ===== ФИНАЛЬНЫЙ ЭКРАН ===== */
  .final-screen {
    display: none;
    animation: fadeIn 0.8s ease;
  }
  .final-screen.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .final-photo {
    width: 100%;
    max-width: 340px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(201, 160, 255, 0.6);
    margin-bottom: 20px;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { box-shadow: 0 20px 60px rgba(201, 160, 255, 0.4); }
    to { box-shadow: 0 20px 80px rgba(201, 160, 255, 0.9); }
  }
  .final-text {
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 15px;
  }

  .hearts {
    position: fixed; inset: 0;
    pointer-events: none; overflow: hidden;
    z-index: 1;
  }
  .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp linear infinite;
    opacity: 0.6;
  }
  @keyframes floatUp {
    from { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    h1 { font-size: 19px; }
    .subtitle { font-size: 14px; }
    .compliment { font-size: 15px; padding: 15px 20px; }
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="hearts" id="hearts"></div>

<div class="wrapper">
  <div id="puzzleScreen">
    <h1>Собери нас в Тейвате ✨</h1>
    <p class="subtitle">Каждый кусочек — тёплое слово для тебя 💙</p>

    <div class="stats">
      <div>Собрано: <span id="progressText">0/9</span></div>
      <div>Слов: <span id="complimentCount">0</span></div>
    </div>

    <div class="puzzle-wrap">
      <div class="puzzle-grid" id="grid"></div>
    </div>

    <p class="subtitle" style="margin-top:15px; font-size:13px;">
      Нажимай на кусочки по порядку ✦
    </p>
  </div>

  <div class="final-screen" id="finalScreen">
    <h1>Ты собрала нас 💙</h1>
    <p class="final-text" id="finalMessage"></p>
    <img id="finalPhoto" class="final-photo" alt="Наше фото">
    <p class="final-text">Даже если мы в разных концах Тейвата — я всегда рядом с тобой. Люблю тебя ❤️</p>
    <button class="btn" onclick="restart()">Собрать заново 🔄</button>
  </div>
</div>

<div class="compliment" id="complimentBox"></div>

<script>
/* ============================================================
   1. НАСТРОЙКИ — ЗАМЕНИ ПОД СЕБЯ
   ============================================================ */

// Фото: положи свой скриншот рядом с index.html и назови "photo.jpg"
// Или вставь ссылку из интернета
const PHOTO_URL = "photo.jpg";

// Комплименты (9 штук — по одному на кусочек)
const COMPLIMENTS = [
  "Ты — мой самый редкий 5★ персонаж 💫",
  "С тобой даже Ранова нам не страшна 🐉",
  "Ты красивее, чем закат Тейвата 🌅",
  "Наша любовь крепче, чем щит Чжун Ли 🛡️",
  "Я бы прошёл с тобой весь Тейват вновь 🗺️",
  "Ты — мой Примогем, самое ценное 💎",
  "С тобой любой рейд в радость ⚔️",
  "Твой голос приятнее, чем саундтрек Genshin 🎵",
  "Я выбираю тебя. Как главного героя своей истории ❤️"
];

const FINAL_MESSAGE = "Ты собрала наш пазл. А я собираю свою жизнь с тобой — по кусочку каждый день. И у меня уже почти получилось 💙";

/* ============================================================
   2. ЛОГИКА (не трогай)
   ============================================================ */
const SIZE = 3;
const TOTAL = SIZE * SIZE;
const grid = document.getElementById('grid');
const progressText = document.getElementById('progressText');
const complimentCountEl = document.getElementById('complimentCount');
const complimentBox = document.getElementById('complimentBox');

let placed = 0;
let complimentsShown = 0;
let nextIndex = 0;
let lastComplimentIndex = -1;

function buildGrid() {
  grid.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    const col = i % SIZE;
    const row = Math.floor(i / SIZE);
    const bgX = (col / (SIZE - 1)) * 100;
    const bgY = (row / (SIZE - 1)) * 100;
    cell.dataset.bgPos = `${bgX}% ${bgY}%`;
    cell.addEventListener('click', () => onCellClick(cell));
    grid.appendChild(cell);
  }
}

function onCellClick(cell) {
  if (cell.classList.contains('filled')) return;
  if (parseInt(cell.dataset.index) !== nextIndex) {
    cell.style.transform = 'translateX(4px)';
    setTimeout(() => cell.style.transform = 'translateX(-4px)', 100);
    setTimeout(() => cell.style.transform = '', 200);
    return;
  }
  cell.style.backgroundImage = `url('${PHOTO_URL}')`;
  cell.style.backgroundPosition = cell.dataset.bgPos;
  cell.classList.add('filled');
  placed++;
  nextIndex++;
  progressText.textContent = `${placed}/${TOTAL}`;
  showCompliment();
  createHeart();
  if (placed === TOTAL) setTimeout(showFinal, 800);
}

function showCompliment() {
  if (complimentsShown >= COMPLIMENTS.length) return;
  let idx;
  do { idx = Math.floor(Math.random() * COMPLIMENTS.length); }
  while (idx === lastComplimentIndex && COMPLIMENTS.length > 1);
  lastComplimentIndex = idx;
  complimentBox.textContent = COMPLIMENTS[idx];
  complimentBox.classList.remove('show');
  void complimentBox.offsetWidth;
  complimentBox.classList.add('show');
  complimentsShown++;
  complimentCountEl.textContent = complimentsShown;
  burstHearts(5);
}

function showFinal() {
  document.getElementById('puzzleScreen').classList.add('hidden');
  const finalScreen = document.getElementById('finalScreen');
  finalScreen.classList.add('show');
  document.getElementById('finalPhoto').src = PHOTO_URL;
  document.getElementById('finalMessage').textContent = FINAL_MESSAGE;
  burstHearts(40);
}

function restart() {
  placed = 0; complimentsShown = 0; nextIndex = 0; lastComplimentIndex = -1;
  progressText.textContent = `0/${TOTAL}`;
  complimentCountEl.textContent = '0';
  document.getElementById('finalScreen').classList.remove('show');
  document.getElementById('puzzleScreen').classList.remove('hidden');
  buildGrid();
}

/* ============================================================
   3. СЕРДЕЧКИ
   ============================================================ */
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = ['💙','✨','💫','💜','⭐','🌸','💖'][Math.floor(Math.random()*7)];
  heart.style.left = Math.random() * 100 + '%';
  heart.style.animationDuration = (3 + Math.random() * 3) + 's';
  heart.style.fontSize = (14 + Math.random() * 20) + 'px';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}
function burstHearts(count) {
  for (let i = 0; i < count; i++) setTimeout(createHeart, i * 80);
}
setInterval(() => { if (Math.random() > 0.7) createHeart(); }, 900);

buildGrid();
</script>
</body>
</html>
